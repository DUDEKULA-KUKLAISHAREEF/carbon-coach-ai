version: '3.8'

services:
  carbon-coach:
    build: .
    container_name: carbon_coach_adk
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - ./carbon_coach:/app/carbon_coach
    restart: unless-stopped
